# Local development stack. Uses the DATABASE_URL in .env (your Supabase project) by default.
#   docker compose up --build            api + web + worker
#   docker compose --profile localdb up  also starts a local Postgres (set DATABASE_URL to it)
# Host ports default to 8001 / 3100 because 8000 / 3000 are often taken; change in .env.
services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3100}
    ports: ["127.0.0.1:${API_PORT:-8001}:8000"]
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    command: ["python", "-m", "app.workers.scheduler", "--loop", "300"]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:${API_PORT:-8001}" }
    ports: ["127.0.0.1:${WEB_PORT:-3100}:3000"]
    depends_on: [api]
    restart: unless-stopped

  db:
    profiles: [localdb]
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: smartbuy, POSTGRES_DB: smartbuy }
    ports: ["127.0.0.1:54330:5432"]
    volumes: [smartbuy-pg:/var/lib/postgresql/data]

volumes:
  smartbuy-pg:
