# Seller discovery for SmartBuy AI (runs in GitHub's cloud). Every 6 hours:
#   * re-checks the vendor websites discovery added earlier
#   * searches the web for new shops selling each product (only when BRAVE_SEARCH_API_KEY is set)
#   * switches off discovered sellers / sites not in stock for 30 days (SELLER_INACTIVE_DAYS)
# Amazon / Myntra seller lists are NOT read here (--no-marketplace): both block GitHub's data-centre addresses.
# They are read from the owner's machine by scripts/run_discovery_local.sh (crontab, every 6 h).
# Required repository secret: SMARTBUY_DATABASE_URL. Optional: BRAVE_SEARCH_API_KEY.
# Migration 20261024000001_seller_discovery.sql must be applied first (python scripts/migrate.py).
name: smartbuy-discover

on:
  schedule:
    - cron: "43 */6 * * *"     # every 6 hours, off the hour and away from smartbuy-collect (:17)
  workflow_dispatch:
    inputs:
      product:
        description: "Optional product_id to run for only that product"
        required: false
        default: ""

concurrency:
  group: smartbuy-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Discover sellers
        env:
          DATABASE_URL: ${{ secrets.SMARTBUY_DATABASE_URL }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          LLM_PROVIDER: none
          PRODUCT_ID: ${{ inputs.product }}
        run: python -m app.workers.discovery --no-marketplace ${PRODUCT_ID:+--product "$PRODUCT_ID"}
